<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Routing Test</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.css" />

    <style>
        /* The map needs a defined height or it won't show up */
        #map {
            height: 100vh;
            width: 100%;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>

    <script>
        // Initialize the map and set view to London
        var map = L.map('map').setView([28.603306, 77.223717], 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Implement Routing
        L.Routing.control({
            waypoints: [
                L.latLng(28.610312, 77.229250), // Start
                L.latLng(28.603306, 77.223717)  // End
            ],
            lineOptions: {
                styles: [{ color: 'blue', opacity: 0.6, weight: 6 }]
            },
            routeWhileDragging: true,
            geocoder: null // We aren't using a search box for this demo
        }).addTo(map);
    </script>
</body>
</html>
